info:
  name: Monthly Average Rates
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUri}}/M.{{currencies}}.EUR.SP00.A?detail=dataOnly&startPeriod=2020-01&endPeriod=2020-12"
  params:
    - name: detail
      value: dataOnly
      type: query
      description: The amount of detail included (full|dataonly|serieskeysonly|nodata)
    - name: startPeriod
      value: 2020-01
      type: query
      description: The start of the date range for which observations are to be returned (YYYY-MM)
    - name: endPeriod
      value: 2020-12
      type: query
      description: The end of the date range for which observations are to be returned (YYYY-MM)

runtime:
  variables:
    - name: currencies
      value: USD+GBP
      description: The currencies whose exchange rates against the Euro are requested (plus sign separated)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
